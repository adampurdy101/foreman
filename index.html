<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foreman</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css?v=24">
</head>
<body>

  <!-- LOGIN -->
  <section id="login-screen" class="login hidden">
    <form id="login-form" class="login-card">
      <h1>Foreman</h1>
      <p class="sub">Your organizer. Private to you.</p>
      <label>Email <input id="login-email" type="email" autocomplete="username" required></label>
      <label>Password <input id="login-password" type="password" autocomplete="current-password" required></label>
      <button id="login-submit" type="submit" class="btn primary">Sign in</button>
      <p id="login-msg" class="msg"></p>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <span class="brand">Foreman</span>

      <div class="seg" id="bucket-seg" role="group" aria-label="Calendar">
        <button data-bucket="work" class="on">Work</button>
        <button data-bucket="home">Home</button>
        <button data-bucket="both">Both</button>
      </div>

      <div class="seg" id="view-seg" role="group" aria-label="View">
        <button data-view="month" class="on">Month</button>
        <button data-view="week">Week</button>
        <button data-view="day">Day</button>
      </div>

      <form id="quick-add" class="quick" autocomplete="off">
        <span class="plus" aria-hidden="true">+</span>
        <input id="quick-input" type="text" placeholder="Quick add (Enter) or tell Foreman anything…">
        <button type="button" id="tell-btn" class="btn sm" title="Send what you typed to Foreman to sort out">Tell Foreman</button>
        <button type="button" id="mic-btn" class="mic" title="Speak it" aria-label="Speak a task"><svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
      </form>

      <button id="tomorrow-btn" class="btn">Tomorrow</button>
      <button id="mini-btn" class="btn ghost" title="Small always-on-top window with today's list">▣ Mini</button>
      <button id="alerts-btn" class="btn ghost" title="Desktop pop-ups for meetings and nags">Alerts: off</button>
      <button id="install-btn" class="btn hidden" title="Run Foreman in its own window">⬇ Install app</button>
      <button id="full-btn" class="btn ghost" title="Full screen">⛶ Full screen</button>
      <button id="logout-btn" class="btn ghost" title="Sign out">Sign out</button>
      <span class="ver" title="App version — tell Claude this number if colors look stale">v24</span>
    </header>

    <main class="layout" id="layout">
      <section class="cal" id="cal">
        <div class="cal-head">
          <button id="prev-btn" class="btn" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg></button>
          <h2 id="cal-title">October 2026</h2>
          <button id="next-btn" class="btn" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg></button>
          <button id="today-btn" class="btn">Today</button>
          <span class="legend">
            <span class="chip p-urgent">!! Urgent</span>
            <span class="chip p-high">▲ High</span>
            <span class="chip p-normal">● Normal</span>
            <span class="chip p-low">– Low</span>
            <span class="chip planned">Planned</span>
            <span class="mtg going" title="Meeting you go to — counts against your 8 h day">■ Meeting (you go)</span>
            <span class="mtg invited" title="Meeting you're invited to — not counted">◌ Invited</span>
          </span>
        </div>
        <div id="cal-body" class="cal-body"></div>
      </section>

      <aside class="rail" id="rail">
        <div id="rail-body"></div>
      </aside>
    </main>

    <div id="mini-root" class="miniwin hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="js/app.js?v=24"></script>
</body>
</html>
